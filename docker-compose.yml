# Só a API publica porta, e apenas em 127.0.0.1. MySQL, Redis e RabbitMQ ficam
# acessíveis somente pela rede interna apoiamais-net.
services:
  mysql:
    build:
      context: .
      dockerfile: Dockerfile.db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_PASSWORD}"
      MYSQL_DATABASE: "ApoiaMaisDB"
      MYSQL_USER: app
      MYSQL_PASSWORD: "${DB_PASSWORD}"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - apoiamais-net

  auth-service:
    env_file:
      - .env
    build:
      context: .
      dockerfile: Dockerfile

    restart: unless-stopped

    ports:
      - "127.0.0.1:8000:8000"

    environment:
      DB_HOST: "mysql"
      DB_PORT: "3306"
      DB_USER: "${DB_USER}"
      DB_PASSWORD: "${DB_PASSWORD}"
      DB_NAME: "ApoiaMaisDB"
      REDIS_URL: "redis://redis:6379/0"

    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_started
      redis:
        condition: service_started

    networks:
      - apoiamais-net

  rabbitmq:
    image: rabbitmq:3-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_DEFAULT_USER}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_DEFAULT_PASS}"
    networks:
      - apoiamais-net

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    networks:
      - apoiamais-net

networks:
  apoiamais-net:
    driver: bridge

volumes:
  db_data:
    driver: local
