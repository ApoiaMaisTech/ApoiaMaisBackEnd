# Só a API publica porta, e apenas em 127.0.0.1. MySQL, Redis, RabbitMQ e os
# workers ficam acessíveis somente pela rede interna apoiamais-net.
#
#   api        FastAPI (HTTP)            -> MySQL, Redis; grava eventos no outbox
#   migrate    alembic upgrade head      -> roda uma vez antes de api/api-worker
#   api-worker outbox -> RabbitMQ e resultados dos jobs -> MySQL (python -m app.worker)
#   go-worker  ai.image.requested -> provedor de IA -> volume de mídia -> ai.image.generated
#              (sem acesso ao MySQL)

x-api-env: &api-env
  DB_HOST: "mysql"
  DB_PORT: "3306"
  DB_USER: "${DB_USER}"
  DB_PASSWORD: "${DB_PASSWORD}"
  DB_NAME: "ApoiaMaisDB"
  REDIS_URL: "redis://:${REDIS_PASSWORD}@redis:6379/0"
  RABBITMQ_URL: "amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672/"
  STORAGE_BACKEND: "local"
  STORAGE_LOCAL_DIR: "/data/media"

x-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_PASSWORD}"
      MYSQL_DATABASE: "ApoiaMaisDB"
      MYSQL_USER: app
      MYSQL_PASSWORD: "${DB_PASSWORD}"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - apoiamais-net

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment: *api-env
    command: ["python", "-m", "alembic", "-c", "app/alembic.ini", "upgrade", "head"]
    restart: "no"
    <<: *hardening
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - apoiamais-net

  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment: *api-env
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - media:/data/media:ro
    read_only: true
    tmpfs:
      - /tmp
    <<: *hardening
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - apoiamais-net

  api-worker:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment: *api-env
    command: ["python", "-m", "app.worker"]
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    <<: *hardening
    healthcheck:
      test: ["CMD", "python", "-m", "app.worker", "--healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    networks:
      - apoiamais-net

  go-worker:
    build:
      context: ./workers/go-worker
    restart: unless-stopped
    environment:
      AMQP_URL: "amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672/"
      REDIS_URL: "redis://:${REDIS_PASSWORD}@redis:6379/1"
      STORAGE_BACKEND: "local"
      STORAGE_LOCAL_DIR: "/data/media"
      AI_PROVIDER: "${AI_PROVIDER:-fake}"
      AI_IMAGE_MODEL: "${AI_IMAGE_MODEL:-gpt-image-1}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      AI_DAILY_IMAGE_BUDGET: "${AI_DAILY_IMAGE_BUDGET:-200}"
      WORKER_CONCURRENCY: "${WORKER_CONCURRENCY:-4}"
    volumes:
      - media:/data/media
    read_only: true
    <<: *hardening
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - apoiamais-net

  rabbitmq:
    # sem o plugin de management: nenhuma interface web exposta
    image: rabbitmq:3.13-alpine
    hostname: rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_DEFAULT_USER}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_DEFAULT_PASS}"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    networks:
      - apoiamais-net

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # sem persistência: rate limit e travas de job (o estado real fica no MySQL)
    command: ["redis-server", "--save", "", "--appendonly", "no", "--requirepass", "${REDIS_PASSWORD}"]
    environment:
      REDISCLI_AUTH: "${REDIS_PASSWORD}"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - apoiamais-net

networks:
  apoiamais-net:
    driver: bridge

volumes:
  db_data:
    driver: local
  rabbitmq_data:
    driver: local
  media:
    driver: local
