[package]
name = "rust-evaluator"
version = "0.1.0"
edition = "2024"
description = "Worker de avaliação de atividades do ApoiaMais (RabbitMQ, sem banco)"
publish = false

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock", "serde"] }
futures-util = "0.3.34"
lapin = { version = "4.12.3", default-features = false, features = ["default-runtime"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "signal", "net", "time", "sync", "io-util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }
unicode-normalization = "0.1.26"
uuid = { version = "1.29.0", features = ["v4", "v5", "serde"] }

[[bin]]
name = "rust-evaluator"
path = "src/main.rs"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
