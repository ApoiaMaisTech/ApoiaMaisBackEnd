name: Sincronizar contrato da API

on:
  push:
    branches:
      - main
    paths:
      - "main.py"
      - "app/**"
      - "requirements.txt"
      - "contratos.json"
      - "scripts/**"
      - ".github/workflows/sync-contrato.yml"
  workflow_dispatch:

concurrency:
  group: sync-contrato
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do backend
        uses: actions/checkout@v4

      # Token de GitHub App: PRs abertos com o GITHUB_TOKEN não disparam
      # os workflows de validação no repositório de integração.
      - name: Gerar token do GitHub App
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ApoiaMaisTech
          repositories: ApoiaMais

      - name: Checkout do repositório de integração
        uses: actions/checkout@v4
        with:
          repository: ApoiaMaisTech/ApoiaMais
          token: ${{ steps.app-token.outputs.token }}
          path: integracao

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Exportar contratos
        run: python scripts/exportar_contratos.py --saida integracao/contratos

      - name: Ler mensagem do commit de origem
        id: origem
        run: |
          {
            echo "mensagem<<EOF_MENSAGEM"
            git log -1 --format=%B "${{ github.sha }}"
            echo "EOF_MENSAGEM"
          } >> "$GITHUB_OUTPUT"

      - name: Abrir/atualizar PR no repositório de integração
        uses: peter-evans/create-pull-request@v6
        with:
          path: integracao
          token: ${{ steps.app-token.outputs.token }}
          branch: contrato/sync-backend
          commit-message: "contrato: atualização vinda do backend (${{ github.sha }})"
          title: "Contrato: atualização vinda do backend"
          labels: |
            contrato
            automatico
          body: |
            Contratos OpenAPI exportados automaticamente do backend.

            **Commit de origem:** ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}

            **Mensagem do commit:**

            ```text
            ${{ steps.origem.outputs.mensagem }}
            ```
